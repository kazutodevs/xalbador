version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: xalbador-backend-dev
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - HOST=0.0.0.0
      # Add your environment variables here or use .env file
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - MAYAR_API_KEY=${MAYAR_API_KEY}
      - PAYMENT_MODE=${PAYMENT_MODE:-test}
      - FRONTEND_URL=${FRONTEND_URL:-https://xalbador.kazuto.biz.id}
      - BACKEND_URL=${BACKEND_URL:-https://api.kazuto.biz.id}
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - xalbador-network
    restart: unless-stopped

networks:
  xalbador-network:
    driver: bridge
