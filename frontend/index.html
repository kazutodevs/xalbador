    <style>
      /* Critical CSS - Loading State */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html {
        scroll-behavior: smooth;
      }
      
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #ffffff;
        color: #0f172a;
      }
      
      /* Dark mode initial */
      @media (prefers-color-scheme: dark) {
        body {
          background: #020617;
          color: #f8fafc;
        }
      }
      
      /* Loading Screen */
      #loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ffffff 0%, #f0f9ff 100%);
        z-index: 9999;
        transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
      }
      
      @media (prefers-color-scheme: dark) {
        #loading-screen {
          background: linear-gradient(135deg, #020617 0%, #0c1e3a 100%);
        }
      }
      
      #loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }
      
      .loading-logo {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        animation: float 3s ease-in-out infinite;
        box-shadow: 0 10px 40px rgba(59, 130, 246, 0.3);
      }
      
      .loading-logo span {
        font-size: 48px;
        font-weight: 800;
        color: white;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(59, 130, 246, 0.1);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      .loading-text {
        margin-top: 20px;
        font-size: 14px;
        font-weight: 500;
        color: #64748b;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
      }
      
      /* Hide scrollbar during loading */
      body.loading {
        overflow: hidden;
      }
      
      /* Prevent FOUC (Flash of Unstyled Content) */
      #root {
        opacity: 0;
        transition: opacity 0.3s ease-in;
      }
      
      #root.loaded {
        opacity: 1;
      }
    </style>
  </head>
  
  <body class="loading">
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-logo">
        <span>C</span>
      </div>
      <div class="loading-spinner"></div>
      <p class="loading-text">Loading Xalbador...</p>
    </div>
    
    <!-- React App Root -->
    <div id="root"></div>
    
    <!-- Module Script -->
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Loading Script -->
    <script>
      // Remove loading screen when app is ready
      window.addEventListener('load', () => {
        const loadingScreen = document.getElementById('loading-screen');
        const root = document.getElementById('root');
        
        // Small delay for smooth transition
        setTimeout(() => {
          loadingScreen.classList.add('hidden');
          root.classList.add('loaded');
          document.body.classList.remove('loading');
          
          // Remove loading screen from DOM after animation
          setTimeout(() => {
            if (loadingScreen.parentNode) {
              loadingScreen.parentNode.removeChild(loadingScreen);
            }
          }, 500);
        }, 500);
      });
      
      // Fallback: Remove loading screen after 10 seconds
      setTimeout(() => {
        const loadingScreen = document.getElementById('loading-screen');
        const root = document.getElementById('root');
        if (loadingScreen && !loadingScreen.classList.contains('hidden')) {
          loadingScreen.classList.add('hidden');
          root.classList.add('loaded');
          document.body.classList.remove('loading');
        }
      }, 10000);
      
      // Theme detection and application
      (function() {
        const theme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    
    <!-- Service Worker Registration (optional for PWA) -->
    <script>
      // Register service worker for PWA support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
              console.log('SW registered:', registration);
            })
            .catch(error => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
    
    <!-- No Script Fallback -->
    <noscript>
      <div style="
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;

            JavaScript Required

            Xalbador requires JavaScript to be enabled in your browser to function properly.
            Please enable JavaScript and refresh the page.
          </p>
        </div>
      </div>
    </noscript>
